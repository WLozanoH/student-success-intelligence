
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-success-intelligence"
version = "1.0.0"
description = "Student performance analytics and predictive intelligence project"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "PyYAML",
    "matplotlib",
    "seaborn"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
